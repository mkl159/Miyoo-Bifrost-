# =====================================================
#  DualBoot Configuration - Miyoo Mini / Mini Plus / Flip
# =====================================================
#
#  COMMENT MODIFIER CE FICHIER :
#  Changez uniquement la VALEUR a droite du signe =
#  Ne touchez pas aux lignes qui commencent par #
#
# =====================================================

LANG=FR
# LANG : FR = francais / EN = anglais / ES = espagnol

VIBRATION_POWER=25
# VIBRATION_POWER : puissance moteur 0 a 100 (0 = desactive)

VIBRATION_SELECT=60
# VIBRATION_SELECT : duree vibration gauche/droite en ms

VIBRATION_CONFIRM=100
# VIBRATION_CONFIRM : duree vibration confirmation en ms

PASSWORD_PROTECT=none
# PASSWORD_PROTECT : none / onion / telmios / both
# Exemple pour proteger OnionOS  -> PASSWORD_PROTECT=onion
# Exemple pour proteger TelmiOS  -> PASSWORD_PROTECT=telmios
# Exemple pour tout proteger     -> PASSWORD_PROTECT=both

PASSWORD_SEQUENCE="UP UP DOWN DOWN A"
# PASSWORD_SEQUENCE : sequence de boutons (entre guillemets)
# Boutons disponibles : UP DOWN LEFT RIGHT A B X Y L R
# SELECT annule la saisie : il ne peut pas faire partie du code.
# START est equivalent a A.

CONFIG_SEQUENCE="UP UP DOWN DOWN"
# CONFIG_SEQUENCE : code secret pour acceder au menu de configuration
# Appuyer X dans le menu de boot pour ouvrir la configuration
# Boutons disponibles : UP DOWN LEFT RIGHT B X Y L1 R1
# A et START valident la saisie, SELECT l'annule : ces trois boutons
# ne peuvent pas faire partie du code (la valeur par defaut serait alors
# conservee).

BOOT_MODE=menu
# BOOT_MODE : menu (defaut) / stealth_telmios / stealth_onion
#   menu            = menu de selection classique au demarrage
#   stealth_telmios = boot direct sur TelmiOS, menu cache
#   stealth_onion   = boot direct sur OnionOS, menu cache
# En mode stealth, le menu reste accessible via le Code Konami pendant KONAMI_TIMEOUT secondes

KONAMI_SEQUENCE="UP UP DOWN DOWN LEFT RIGHT LEFT RIGHT B"
# KONAMI_SEQUENCE : sequence secrete pour reveler le menu en mode stealth
# Jusqu'a 10 boutons. Boutons disponibles : UP DOWN LEFT RIGHT A B X Y L R

KONAMI_TIMEOUT=5
# KONAMI_TIMEOUT : duree d'ecoute du Code Konami au demarrage en secondes (1 a 30)
# Passe ce delai sans la bonne sequence, l'OS configure est lance directement
